spring:
  application:
    name: schoolable-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/schoolable
    username: postgres
    password: folasayo
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

logging:
  level:
    root: INFO

jwt:
  secret: "super-secret-change-me-please-32bytes-minimum-1234567890"
  expirationSeconds: 86400

resend:
  apiKey: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:no-reply@schoolable.local}
  verifyLinkBase: ${RESEND_VERIFY_LINK_BASE:http://localhost:8081/auth/verify-link?token=}

# Cloudinary configuration for file storage
# Get your credentials from https://cloudinary.com/console
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# File upload limits
spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB
