spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: schoolable-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Allow out-of-order migrations and clean up on validation errors
    out-of-order: true
    validate-on-migrate: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: ${PORT:8081}

logging:
  level:
    root: INFO

schoolable:
  cache:
    redis:
      enabled: false

jwt:
  secret: ${JWT_SECRET}
  expirationSeconds: 86400

resend:
  apiKey: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:no-reply@schoolable.local}
  verifyLinkBase: ${RESEND_VERIFY_LINK_BASE:http://localhost:8081/auth/verify-link?token=}

# Cloudinary configuration for file storage
# Get your credentials from https://cloudinary.com/console
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# Gemini AI configuration for KPI insights
gemini:
  api:
    key: ${GEMINI_API_KEY:}
