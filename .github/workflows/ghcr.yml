name: Build and Push (GHCR)

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ghcr.io/mofolasayo/schoolable_backend:latest
            ghcr.io/mofolasayo/schoolable_backend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Resolve SSH key
        run: |
          echo "DROPLET_SSH_KEY_RESOLVED<<EOF" >> $GITHUB_ENV
          if [ -n "${{ secrets.DROPLET_SSH_KEY_B64 }}" ]; then
            echo "${{ secrets.DROPLET_SSH_KEY_B64 }}" | base64 -d >> $GITHUB_ENV
          else
            echo "${{ secrets.DROPLET_SSH_KEY }}" >> $GITHUB_ENV
          fi
          echo "EOF" >> $GITHUB_ENV
      - name: Deploy on droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ env.DROPLET_SSH_KEY_RESOLVED }}
          script: |
            cd ~/schoolable_backend
            set -a && . .kamal/secrets && set +a
            export KAMAL_SSH_KEY=~/.ssh/kamal_self
            kamal deploy --skip-push --version latest
